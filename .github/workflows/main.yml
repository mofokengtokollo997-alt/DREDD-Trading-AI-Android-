
name: DREDD Trading AI Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Android project
        run: |
          mkdir -p project
          ZIP=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP" ]; then
            unzip -oq "$ZIP" -d project
          else
            cp -r ./* project/ 2>/dev/null || true
          fi

      - name: Locate Gradle project
        run: |
          SETTINGS=$(find project -name settings.gradle.kts -o -name settings.gradle | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "Gradle settings file not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DREDD-Trading-AI-APK
          path: project/**/build/outputs/apk/debug/*.apk
